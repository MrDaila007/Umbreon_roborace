# Резервная копия GitHub-hosted CI (ubuntu-latest).
# Активный пайплайн: .github/workflows/ci.yml (self-hosted).

name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  schedule:
    - cron: '0 2 * * 1'   # weekly Monday 02:00 UTC — catch dependency breakage

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # ── Detect which files changed ──────────────────────────────────
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
      python:   ${{ steps.filter.outputs.python }}
      ros2:     ${{ steps.filter.outputs.ros2 }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            firmware:
              - '*.ino'
              - '*.h'
              - 'wifi_debug/**'
              - '.github/workflows/ci.yml'
            python:
              - 'dashboard/**'
              - 'simulation/**'
              - 'requirements*.txt'
              - 'ruff.toml'
              - '.github/workflows/ci.yml'
            ros2:
              - 'ros2/**'
              - 'dashboard/protocol.py'
              - 'dashboard/car_config.py'
              - '.github/workflows/ci.yml'

  # ── Code style review (inline PR annotations) ────────────────────
  style-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install reviewdog and ruff
        run: |
          pip install ruff
          curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh -s -- -b /usr/local/bin

      - name: Ruff review (Python)
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ruff check --output-format rdjson dashboard/ simulation/ ros2/ \
            | reviewdog -f rdjson -reporter=github-pr-review -level=warning

      - name: Install cppcheck
        run: sudo apt-get install -y --no-install-recommends cppcheck

      - name: cppcheck review (C++)
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cppcheck --language=c++ --std=c++17 --enable=warning,performance \
            --template='{file}:{line}:{column}: {severity}: {message} [{id}]' \
            --suppress=missingIncludeSystem \
            *.ino *.h 2>&1 \
            | reviewdog -efm='%f:%l:%c: %t%*[^:]: %m' -reporter=github-pr-review -level=warning

  # ── Firmware compilation ──────────────────────────────────────────
  firmware-build:
    needs: changes
    if: always() && (needs.changes.outputs.firmware == 'true' || github.event_name == 'pull_request' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Cache board package
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-rp2040-${{ hashFiles('Umbreon_roborace.ino') }}
          restore-keys: arduino-rp2040-

      - name: Install rp2040 board package
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index
          arduino-cli core install rp2040:rp2040

      - name: Install Arduino libraries
        run: |
          arduino-cli lib install "Adafruit_VL53L0X"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "EncButton"

      - name: Compile firmware
        run: arduino-cli compile -b rp2040:rp2040:rpipico2 . --output-dir build

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-pico2
          path: build/
          if-no-files-found: warn

  # ── Python lint ───────────────────────────────────────────────────
  python-lint:
    needs: changes
    if: always() && (needs.changes.outputs.python == 'true' || github.event_name == 'pull_request' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Lint dashboard and simulation
        run: ruff check dashboard/ simulation/

  # ── Python import check ──────────────────────────────────────────
  python-import:
    needs: changes
    if: always() && (needs.changes.outputs.python == 'true' || github.event_name == 'pull_request' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tk for matplotlib (plots.py)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-tk

      - name: Install dependencies
        run: pip install -r dashboard/requirements.txt

      - name: Check dashboard imports
        working-directory: dashboard
        run: |
          python -c "import protocol; print('protocol OK')"
          python -c "import car_config; print('car_config OK')"
          python -c "import connection; print('connection OK')"
          python -c "import telemetry; print('telemetry OK')"
          python -c "import settings_file; print('settings_file OK')"
          python -c "import plots; print('plots OK')"
          python -c "import track_map; print('track_map OK')"
          python -c "import settings_panel; print('settings_panel OK')"
          python -c "import server; print('server OK')"
          python -c "import app; print('app OK')"

      - name: Install simulation dependencies
        run: pip install -r simulation/requirements.txt

      - name: Check simulation imports
        working-directory: simulation
        run: python -c "import sim; print('sim OK')"

  # ── ROS2 Docker build ────────────────────────────────────────────
  ros2-build:
    needs: changes
    if: always() && (needs.changes.outputs.ros2 == 'true' || github.event_name == 'pull_request' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ROS2 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ros2/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
